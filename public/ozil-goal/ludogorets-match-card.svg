<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ludogorets 2–3 Arsenal, 1 November 2016</title>
  <desc id="desc">An original editorial scorecard showing Arsenal's comeback from two goals down. No match photography or club crests are used.</desc>
  <rect width="1200" height="630" fill="#fbf6ee"/>
  <rect x="34" y="34" width="1132" height="562" rx="24" fill="#fffdf9" stroke="#e6d9c6" stroke-width="2"/>
  <rect x="74" y="78" width="6" height="43" rx="3" fill="#e8650f"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="98" y="97" fill="#b9460a" font-size="18" font-weight="700" letter-spacing="3">THE ORIGINAL MOMENT</text>
    <text x="98" y="124" fill="#5c5047" font-size="16">1 NOVEMBER 2016 · CHAMPIONS LEAGUE · GROUP A</text>
    <text x="74" y="204" fill="#1d140e" font-size="42" font-weight="700">Özil's Ludogorets winner</text>
    <line x1="74" y1="234" x2="1126" y2="234" stroke="#e6d9c6" stroke-width="2"/>
    <text x="258" y="299" text-anchor="middle" fill="#5c5047" font-size="23">LUDOGORETS</text>
    <text x="942" y="299" text-anchor="middle" fill="#5c5047" font-size="23">ARSENAL</text>
    <text x="258" y="422" text-anchor="middle" fill="#1d140e" font-size="120" font-weight="700">2</text>
    <text x="600" y="402" text-anchor="middle" fill="#9d8b77" font-size="62">–</text>
    <text x="942" y="422" text-anchor="middle" fill="#b9460a" font-size="120" font-weight="700">3</text>
    <rect x="378" y="464" width="444" height="52" rx="26" fill="#fde6cb"/>
    <text x="600" y="497" text-anchor="middle" fill="#7a3208" font-size="22" font-weight="700">FROM 0–2 DOWN TO VICTORY</text>
    <text x="74" y="563" fill="#5c5047" font-size="14">OZIL GOAL GENERATOR · ORIGINAL EDITORIAL GRAPHIC</text>
    <text x="1126" y="563" text-anchor="end" fill="#5c5047" font-size="14">SOFIA, BULGARIA</text>
  </g>
</svg>
